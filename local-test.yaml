seed: 21
model:
  name: flex_bert
  model_config:
    padding: unpadded
    mlp_layer: glu
    bert_layer: prenorm
    embed_norm: true
    final_norm: true
    hidden_act: gelu
    vocab_size: 256000
    hidden_size: 768
    init_method: full_megatron
    loss_kwargs:
      reduction: mean
    mlp_in_bias: false
    norm_kwargs:
      eps: 1.0e-05
      bias: false
    mlp_out_bias: false
    attn_out_bias: false
    attn_qkv_bias: false
    compile_model: true
    head_pred_act: gelu
    loss_function: fa_cross_entropy
    normalization: layernorm
    rotary_emb_dim: null
    sliding_window: 128
    attention_layer: rope
    embedding_layer: sans_pos
    rotary_emb_base: 10000
    mlp_dropout_prob: 0
    unpad_embeddings: true
    intermediate_size: 1152
    masked_prediction: true
    num_hidden_layers: 22
    embed_dropout_prob: 0
    skip_first_prenorm: true
    activation_function: gelu
    num_attention_heads: 12
    attn_out_dropout_prob: 0.1
    rotary_emb_scale_base: null
    rotary_emb_interleaved: false
    allow_embedding_resizing: true
    global_attn_every_n_layers: 3
    local_attn_rotary_emb_base: 10000
    attention_probs_dropout_prob: 0
  tokenizer_name: google/gemma-2-9b
  disable_train_metrics: true
  pretrained_model_name: bert-base-uncased
loggers: {}
callbacks:
  lr_monitor: {}
  scheduled_gc: {}
  log_grad_norm:
    batch_log_interval: 100
  speed_monitor:
    window_size: 100
  runtime_estimator: {}
  packing_efficiency:
    log_interval: 100
optimizer:
  lr: 8.0e-04
  eps: 1.0e-08
  name: decoupled_stableadamw
  betas:
    - 0.9
    - 0.95
  weight_decay: 8.0e-05
  log_grad_norm: true
  filter_bias_norm_wd: true
precision: amp_bf16
scheduler:
  name: warmup_stable_decay
  alpha_f: 0.02
  t_decay: 0tok
  t_warmup: 0tok
variables:
  lr: 8.0e-04
  t_warmup: 0tok
  bs_warmup: 0tok
  data_local: mmbert-local-data
  data_remote: null
  max_seq_len: 1024
  my_run_name: mmbert-300m-chr-full
  tokenizer_name: google/gemma-2-9b
  mlm_probability: 0.25
  count_padding_tokens: false
  device_train_microbatch_size: 48
autoresume: true
save_folder: /weka/projects/bvandur1/mmarone1/temp
max_duration: 10_000_000tok
progress_bar: false
train_loader:
  name: text
  dataset:
    local: /projects/bvandur1/mmarone1/data-sample
    split: train
    remote: null
    shuffle: true
    streaming: false
    max_seq_len: 1024
    shuffle_seed: 21
    tokenizer_name: google/gemma-2-9b
    mlm_probability: 0.25
  drop_last: true
  num_workers: 6
  bos_token_id: 2
  eos_token_id: 1
  pad_token_id: 0
  sep_token_id: 1
  mask_token_id: 4
  sequence_packing: true
  batch_size_warmup_tokens: 0tok
  batch_size_warmup_min_size: 48
eval_interval: 99999999999999999999999999999999ba
save_interval: 10_000_000_000tok
log_to_console: true
python_log_level: DEBUG
console_log_interval: 25ba
reset_time: true # important! only run this once
device_eval_batch_size: 36
global_eval_batch_size: 1024
global_train_batch_size: 4608
device_train_microbatch_size: 48
save_num_checkpoints_to_keep: 100000
